<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
  <title>方案评价矩阵</title>
  <desc>方案 A/B/C 与技术、成本、风险、可维护性评分</desc>
  <text x="300" y="20" font-size="14" text-anchor="middle" font-weight="bold">方案评价矩阵</text>
  
  <!-- Headers -->
  <rect x="120" y="40" width="100" height="30" fill="#1976d2"/><text x="170" y="60" fill="white" font-size="11" text-anchor="middle">技术</text>
  <rect x="220" y="40" width="100" height="30" fill="#1976d2"/><text x="270" y="60" fill="white" font-size="11" text-anchor="middle">成本</text>
  <rect x="320" y="40" width="100" height="30" fill="#1976d2"/><text x="370" y="60" fill="white" font-size="11" text-anchor="middle">风险</text>
  <rect x="420" y="40" width="100" height="30" fill="#1976d2"/><text x="470" y="60" fill="white" font-size="11" text-anchor="middle">可维护</text>
  
  <!-- Rows -->
  <rect x="20" y="70" width="100" height="30" fill="#e3f2fd"/><text x="70" y="90" font-size="11" text-anchor="middle">方案 A</text>
  <rect x="120" y="70" width="100" height="30" fill="#c8e6c9"/><text x="170" y="90" font-size="11" text-anchor="middle">9</text>
  <rect x="220" y="70" width="100" height="30" fill="#c8e6c9"/><text x="270" y="90" font-size="11" text-anchor="middle">7</text>
  <rect x="320" y="70" width="100" height="30" fill="#c8e6c9"/><text x="370" y="90" font-size="11" text-anchor="middle">8</text>
  <rect x="420" y="70" width="100" height="30" fill="#c8e6c9"/><text x="470" y="90" font-size="11" text-anchor="middle">8</text>
  
  <rect x="20" y="100" width="100" height="30" fill="#e3f2fd"/><text x="70" y="120" font-size="11" text-anchor="middle">方案 B</text>
  <rect x="120" y="100" width="100" height="30" fill="#c8e6c9"/><text x="170" y="120" font-size="11" text-anchor="middle">8</text>
  <rect x="220" y="100" width="100" height="30" fill="#c8e6c9"/><text x="270" y="120" font-size="11" text-anchor="middle">8</text>
  <rect x="320" y="100" width="100" height="30" fill="#c8e6c9"/><text x="370" y="120" font-size="11" text-anchor="middle">7</text>
  <rect x="420" y="100" width="100" height="30" fill="#c8e6c9"/><text x="470" y="120" font-size="11" text-anchor="middle">9</text>
  
  <rect x="20" y="130" width="100" height="30" fill="#e3f2fd"/><text x="70" y="150" font-size="11" text-anchor="middle">方案 C</text>
  <rect x="120" y="130" width="100" height="30" fill="#c8e6c9"/><text x="170" y="150" font-size="11" text-anchor="middle">7</text>
  <rect x="220" y="130" width="100" height="30" fill="#c8e6c9"/><text x="270" y="150" font-size="11" text-anchor="middle">9</text>
  <rect x="320" y="130" width="100" height="30" fill="#c8e6c9"/><text x="370" y="150" font-size="11" text-anchor="middle">6</text>
  <rect x="420" y="130" width="100" height="30" fill="#c8e6c9"/><text x="470" y="150" font-size="11" text-anchor="middle">7</text>
  
  <text x="300" y="190" font-size="11" text-anchor="middle">推荐：方案 A（综合得分最高）</text>
</svg>