<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <title>Agent 工作流循环</title>
  <desc>用户输入 → 任务澄清 → 功能分解 → 方案生成 → 评价 → 输出模板 → 迭代</desc>
  <rect x="20" y="50" width="90" height="45" rx="6" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="65" y="78" font-size="11" text-anchor="middle">用户输入</text>
  
  <rect x="130" y="50" width="90" height="45" rx="6" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="175" y="78" font-size="11" text-anchor="middle">任务澄清</text>
  
  <rect x="240" y="50" width="90" height="45" rx="6" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="285" y="78" font-size="11" text-anchor="middle">功能分解</text>
  
  <rect x="350" y="50" width="90" height="45" rx="6" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="395" y="78" font-size="11" text-anchor="middle">方案生成</text>
  
  <rect x="460" y="50" width="90" height="45" rx="6" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="505" y="78" font-size="11" text-anchor="middle">评价</text>
  
  <rect x="570" y="50" width="90" height="45" rx="6" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="615" y="78" font-size="11" text-anchor="middle">输出模板</text>
  
  <rect x="680" y="50" width="90" height="45" rx="6" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="725" y="78" font-size="11" text-anchor="middle">迭代</text>
  
  <path d="M110 72 L130 72" stroke="#388e3c" stroke-width="2"/>
  <path d="M220 72 L240 72" stroke="#388e3c" stroke-width="2"/>
  <path d="M330 72 L350 72" stroke="#388e3c" stroke-width="2"/>
  <path d="M440 72 L460 72" stroke="#388e3c" stroke-width="2"/>
  <path d="M550 72 L570 72" stroke="#388e3c" stroke-width="2"/>
  <path d="M660 72 L680 72" stroke="#388e3c" stroke-width="2"/>
  
  <path d="M725 95 Q 400 140 65 95" stroke="#388e3c" stroke-width="2" fill="none" stroke-dasharray="4,2"/>
  <text x="400" y="145" font-size="10" text-anchor="middle" fill="#388e3c">人类复核与迭代</text>
</svg>