<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方法论图解 — 工程设计方法论</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="container">
    <p><a href="index.html">← 返回首页</a></p>
    <h1>方法论图解</h1>
    
    <section>
      <h2>工程设计核心流程</h2>
      <object data="assets/diagrams/design-process-flow.svg" type="image/svg+xml" width="900"></object>
      <p>此图展示了从产品计划到 CAD 的完整阶段流程，帮助理解各阶段的逻辑顺序与迭代关系。Agent 可使用此图作为工作流导航模板。</p>
    </section>
    
    <section>
      <h2>功能分解流程</h2>
      <object data="assets/diagrams/function-decomposition.svg" type="image/svg+xml" width="700"></object>
      <p>展示总功能到方案组合的分解路径。Agent 可据此自动生成功能结构与原理搜索任务。</p>
    </section>
    
    <section>
      <h2>方案评价矩阵</h2>
      <object data="assets/diagrams/evaluation-matrix.svg" type="image/svg+xml" width="600"></object>
      <p>直观展示多方案在多个维度上的评分对比。Agent 可直接输出此类结构化评价结果。</p>
    </section>
    
    <section>
      <h2>Agent 工作流循环</h2>
      <object data="assets/diagrams/agent-workflow-loop.svg" type="image/svg+xml" width="800"></object>
      <p>展示 Agent 从输入到输出的完整闭环，支持人类复核迭代。Hermes 可使用此图作为 skill 核心流程。</p>
    </section>
    
    <hr>
    <p><em>Phase 1C 图解页面：用于方法论演示。</em></p>
  </div>
