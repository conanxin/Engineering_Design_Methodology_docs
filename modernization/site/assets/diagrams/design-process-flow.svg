<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120">
  <title>工程设计核心流程</title>
  <desc>产品计划 → 任务书澄清 → 方案设计 → 技术设计 → 施工设计 → 成本估算 → CAD/软件设计</desc>
  <rect x="10" y="40" width="110" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="65" y="70" font-size="12" text-anchor="middle">产品计划</text>
  
  <rect x="140" y="40" width="110" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="195" y="70" font-size="12" text-anchor="middle">任务书澄清</text>
  
  <rect x="270" y="40" width="110" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="325" y="70" font-size="12" text-anchor="middle">方案设计</text>
  
  <rect x="400" y="40" width="110" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="455" y="70" font-size="12" text-anchor="middle">技术设计</text>
  
  <rect x="530" y="40" width="110" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="585" y="70" font-size="12" text-anchor="middle">施工设计</text>
  
  <rect x="660" y="40" width="110" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="715" y="70" font-size="12" text-anchor="middle">成本估算</text>
  
  <rect x="790" y="40" width="100" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="840" y="70" font-size="11" text-anchor="middle">CAD/软件</text>
  
  <path d="M120 65 L140 65" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M250 65 L270 65" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M380 65 L400 65" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M510 65 L530 65" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 65 L660 65" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M770 65 L790 65" stroke="#1976d2" stroke-width="2" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1976d2"/>
    </marker>
  </defs>
</svg>